name: Production PostgreSQL smoke

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: [database, redis]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual production images
        run: |
          revision="$(git rev-parse HEAD)"
          docker build --build-arg "SOURCE_REVISION=$revision" --target runtime --tag laravel-php:production-smoke .
          docker build --build-arg "SOURCE_REVISION=$revision" --target nginx --tag laravel-nginx:production-smoke .
      - name: Exercise production images with disposable PostgreSQL
        run: bash tests/Docker/production-smoke.sh laravel-php:production-smoke laravel-nginx:production-smoke "$(git rev-parse HEAD)" "${{ matrix.store }}"
