name: Disposable controlled deployment smoke

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Load one shared PHP/HTTPS image graph into the disposable daemon only
        run: |
          SOURCE_REVISION="$(git rev-parse HEAD)" RELEASE_VERSION=v0.0.1 docker buildx bake --file docker-bake.release.hcl \
            --set php.tags=laravel-php:deployment-fixture --set php.output=type=docker \
            --set nginx.tags=laravel-nginx:deployment-fixture --set nginx.output=type=docker release
      - name: Exercise the actual promotion and fail-closed boundaries using synthetic private Pg/TLS files
        run: sudo --preserve-env=RUNNER_TEMP python3 tests/Docker/deployment-smoke.py laravel-php:deployment-fixture laravel-nginx:deployment-fixture "$(git rev-parse HEAD)"
