name: Runtime secrets contract

on:
  pull_request:
    branches: [dev]
    paths:
      - infra/aws/scripts/runtime_secrets.py
      - infra/aws/tests/test_runtime_secrets.py
      - compose.production.processes.yaml
      - compose.production.https.yaml
      - compose.production.migrations.yaml
      - tests/Docker/runtime-secrets-smoke.py
      - .github/workflows/runtime-secrets-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check private delivery and failure boundaries without AWS
        run: python3 infra/aws/tests/test_runtime_secrets.py
      - name: Verify actual PHP environment in disposable containers
        run: python3 tests/Docker/runtime-secrets-smoke.py
