name: Prepare template release

on:
  pull_request:
    paths:
      - .github/scripts/template_release.py
      - .github/scripts/test_template_release.py
      - .github/workflows/template-release.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable SemVer tag (vMAJOR.MINOR.PATCH)'
        required: true
        type: string
      source_sha:
        description: 'Full tested main SHA, with successful exact coverage'
        required: true
        type: string
      changes:
        description: 'Reviewed changes for template consumers'
        required: true
        type: string
      compatibility:
        description: 'Compatibility changes and material risks, or none'
        required: true
        type: string
      upgrade:
        description: 'Upgrade/migration instructions, or none'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: template-release-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release policy without remote mutations
        run: python3 -m unittest discover -s .github/scripts -p 'test_template_release.py'

  prepare:
    if: github.event_name == 'workflow_dispatch'
    needs: release-policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - name: Checkout approved workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source, gates, version and reviewed notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_CHANGES: ${{ inputs.changes }}
          RELEASE_RISKS: ${{ inputs.compatibility }}
          RELEASE_UPGRADE: ${{ inputs.upgrade }}
        run: python3 .github/scripts/template_release.py
      - name: Retain reviewable release preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: template-release-preview-${{ inputs.version }}
          path: release-preview/
          if-no-files-found: error
          retention-days: 14
