name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Verify setup can be rerun without changing the application key
        run: |
          environment_before="$(sha256sum .env)"
          composer setup
          test "$environment_before" = "$(sha256sum .env)"

      - name: Run CI Checks
        run: composer ci:check

  minimum-php:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Build minimum PHP test environment
        run: |
          docker build --tag minimum-php - <<'DOCKERFILE'
          FROM php:8.4.1-cli-bookworm@sha256:246d2ca7e9cf21c4e7c354ce87e87bf1ad6d41b2061c77668845e04a8f8889d4
          RUN apt-get update && apt-get install -y --no-install-recommends unzip git \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Install dependencies on minimum PHP
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --env COMPOSER_HOME=/tmp/composer \
            --volume "$PWD:/app" \
            --volume "$(command -v composer):/usr/local/bin/composer:ro" \
            --workdir /app minimum-php sh -ec '
              test "$(php -r "echo PHP_VERSION;")" = "8.4.1"
              composer install --no-interaction --prefer-dist
              composer check-platform-reqs
              cp .env.example .env
              php artisan app:ensure-key --no-interaction
              php artisan migrate --force --no-interaction
            '

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run tests on minimum PHP
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/app" --workdir /app minimum-php \
            php artisan test --compact

  coverage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup
        env:
          XDEBUG_MODE: 'off'

      - name: Run exact line and branch coverage gate
        run: composer coverage
        env:
          COMPOSER_PROCESS_TIMEOUT: 0

  postgres-concurrency:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: teams_test
          POSTGRES_USER: teams
          POSTGRES_PASSWORD: teams
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teams -d teams_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: teams_test
      DB_USERNAME: teams
      DB_PASSWORD: teams

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pcntl, posix
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction
          php artisan migrate:fresh --force --no-interaction

      - name: Run PostgreSQL concurrency tests
        run: php artisan test --compact --testsuite=Concurrency

  sail:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install Sail from the existing lockfile
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.sail.example .env
          php artisan app:ensure-key --no-interaction
          echo "WWWUSER=$(id -u)" >> "$GITHUB_ENV"
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"

      - name: Validate and start the development environment
        run: |
          docker compose config --quiet
          ./vendor/bin/sail build
          ./vendor/bin/sail up --detach --wait --wait-timeout 120

      - name: Verify versions and available tooling
        run: |
          ./vendor/bin/sail php -r 'exit(PHP_VERSION_ID >= 80401 && PHP_VERSION_ID < 80500 ? 0 : 1);'
          ./vendor/bin/sail composer check-platform-reqs
          ./vendor/bin/sail node --version | grep '^v22\.'
          ./vendor/bin/sail npm --version
          ./vendor/bin/sail artisan list --no-interaction
          test "$(docker compose exec -T pgsql psql -U sail -d laravel -Atc 'SHOW server_version_num' | cut -c1-2)" = 16

      - name: Verify explicit setup preserves keys and database records
        run: |
          test "$(docker compose exec -T pgsql psql -U sail -d laravel -Atc "SELECT to_regclass('public.migrations') IS NULL")" = t
          ./vendor/bin/sail composer setup
          environment_before="$(sha256sum .env)"
          docker compose exec -T pgsql psql -U sail -d laravel -v ON_ERROR_STOP=1 -c "CREATE TABLE sail_persistence_probe (id integer PRIMARY KEY); INSERT INTO sail_persistence_probe VALUES (42)"
          ./vendor/bin/sail composer setup
          test "$environment_before" = "$(sha256sum .env)"
          docker compose down
          ./vendor/bin/sail up --detach --wait --wait-timeout 120
          test "$(docker compose exec -T pgsql psql -U sail -d laravel -Atc 'SELECT id FROM sail_persistence_probe')" = 42
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8000/up
          curl --fail http://localhost:8000/login > /dev/null

      - name: Verify application contracts in Sail
        run: |
          ./vendor/bin/sail test --compact tests/Feature/InfrastructureBaselineTest.php tests/Feature/SetupKeyTest.php
          test "$(docker compose exec -T pgsql psql -U sail -d laravel -Atc 'SELECT id FROM sail_persistence_probe')" = 42

      - name: Verify Redis is opt-in with independent driver selection
        run: |
          test -z "$(docker compose ps --services --filter status=running | grep '^redis$' || true)"
          docker compose --profile redis up --detach --wait --wait-timeout 120 redis
          test "$(docker compose --profile redis exec -T redis redis-cli ping)" = PONG
          for purpose in CACHE_STORE SESSION_DRIVER QUEUE_CONNECTION; do
            docker compose exec -T -e "$purpose=redis" -e "PURPOSE=$purpose" laravel.test php -r '
              require "vendor/autoload.php";
              $app = require "bootstrap/app.php";
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $drivers = ["CACHE_STORE" => "cache.default", "SESSION_DRIVER" => "session.driver", "QUEUE_CONNECTION" => "queue.default"];
              foreach ($drivers as $purpose => $key) {
                  if (config($key) !== ($purpose === getenv("PURPOSE") ? "redis" : "database")) {
                      exit(1);
                  }
              }
            '
          done
          docker compose --profile redis stop redis
          curl --fail http://localhost:8000/up
          curl --fail http://localhost:8000/login > /dev/null

      - name: Show container diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color

      - name: Stop disposable CI containers
        if: always()
        run: docker compose --profile redis down
