name: Offline Compose contract

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify policy regressions
        run: python3 .github/scripts/test_infrastructure_policy.py
      - name: Resolve development and production profiles without starting services
        run: python3 .github/scripts/check_compose.py
