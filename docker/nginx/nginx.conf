worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 2m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_body_temp_path /tmp/nginx/client-body;
    fastcgi_temp_path /tmp/nginx/fastcgi;

    # Docker's embedded DNS resolves the Compose php service on EC2's private bridge network.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream php_fpm {
        zone php_fpm 64k;
        server php:9000 resolve;
    }

    server {
        listen 8080;
        server_name _;
        root /app/public;
        index index.php;
        autoindex off;
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param DOCUMENT_ROOT /app/public;
            fastcgi_param HTTP_PROXY "";
            fastcgi_hide_header X-Powered-By;
            fastcgi_connect_timeout 5s;
            fastcgi_send_timeout 30s;
            fastcgi_read_timeout 30s;
            fastcgi_pass php_fpm;
        }

        location ~ /\. {
            return 404;
        }

        location ~* \.(?:php[0-9]*|phtml|phar|inc)(?:/|$) {
            return 404;
        }

        location ~* (?:^|/)(?:artisan|composer\.(?:json|lock)|package(?:-lock)?\.json|auth\.json)(?:/|$) {
            return 404;
        }

        location ~* \.(?:pem|key|p12|pfx|env|sqlite[0-9]*|sql|bak|old)(?:/|$) {
            return 404;
        }

        location /build/assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
        }
    }
}
