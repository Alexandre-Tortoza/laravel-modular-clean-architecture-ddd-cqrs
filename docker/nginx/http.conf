map $server_port $application_server_port {
    default $server_port;
    8443 443;
}
include /etc/nginx/mime.types;
default_type application/octet-stream;
map $request_uri $logged_uri {
    default "";
    ~^/reset-password/ /reset-password/[redacted];
    ~^/email/verify/ /email/verify/[redacted];
    ~^(?<path_without_query>[^?]*) $path_without_query;
}
log_format main '$remote_addr - [$time_local] "$request_method $logged_uri $server_protocol" '
                '$status $body_bytes_sent';
access_log /dev/stdout main;
server_tokens off;
sendfile on;
keepalive_timeout 30s;
client_max_body_size 2m;
client_header_timeout 10s;
client_body_timeout 30s;
send_timeout 30s;
client_body_temp_path /tmp/nginx/client-body;
fastcgi_temp_path /tmp/nginx/fastcgi;
proxy_temp_path /tmp/nginx/proxy;
uwsgi_temp_path /tmp/nginx/uwsgi;
scgi_temp_path /tmp/nginx/scgi;

# Docker's embedded DNS resolves the Compose php service on EC2's private bridge network.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
upstream php_fpm {
    zone php_fpm 64k;
    server php:9000 resolve;
}

